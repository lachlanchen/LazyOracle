<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">LazyOracle</title>
  <desc id="desc">A gold bagua ring, a hexagram and a constellation on a deep night-blue field, beside the LazyOracle wordmark.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b0d1f"/>
      <stop offset="0.55" stop-color="#141a3a"/>
      <stop offset="1" stop-color="#0d1330"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f0d9a3"/>
      <stop offset="0.5" stop-color="#d6b26a"/>
      <stop offset="1" stop-color="#a8813d"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1600" height="600" rx="44" fill="url(#sky)"/>
  <circle cx="1290" cy="90" r="280" fill="#d6b26a" opacity=".05"/>
  <circle cx="220" cy="540" r="300" fill="#6f7bd6" opacity=".06"/>

  <!-- Scattered stars -->
  <g fill="#ffffff">
    <circle cx="140" cy="96" r="2.4" opacity=".75"/><circle cx="268" cy="168" r="1.6" opacity=".5"/>
    <circle cx="392" cy="82" r="2" opacity=".6"/><circle cx="520" cy="150" r="1.4" opacity=".45"/>
    <circle cx="700" cy="70" r="2.2" opacity=".65"/><circle cx="866" cy="140" r="1.5" opacity=".4"/>
    <circle cx="1020" cy="86" r="2" opacity=".6"/><circle cx="1180" cy="168" r="1.6" opacity=".45"/>
    <circle cx="180" cy="430" r="1.8" opacity=".5"/><circle cx="330" cy="500" r="1.4" opacity=".4"/>
    <circle cx="640" cy="520" r="2" opacity=".5"/><circle cx="980" cy="470" r="1.6" opacity=".45"/>
    <circle cx="1400" cy="430" r="2.2" opacity=".55"/><circle cx="1500" cy="220" r="1.6" opacity=".4"/>
  </g>

  <!-- Constellation, drawn between a few of the stars -->
  <g stroke="#d6b26a" stroke-width="1.6" opacity=".45" fill="none">
    <path d="M140 96 L268 168 L392 82 L520 150 L700 70"/>
    <path d="M1020 86 L1180 168 L1400 430"/>
  </g>

  <!-- Bagua ring: the eight trigrams of the later heaven arrangement -->
  <g transform="translate(300 300)" filter="url(#glow)">
    <circle r="172" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity=".8"/>
    <circle r="120" fill="none" stroke="url(#gold)" stroke-width="1.4" opacity=".5"/>
    <g fill="url(#gold)">
      <!-- Each trigram: three bars, broken bars split in two. Angles every 45°. -->
      <g transform="rotate(0) translate(0 -150)">
        <rect x="-26" y="-14" width="52" height="7" rx="3.5"/><rect x="-26" y="-3" width="52" height="7" rx="3.5"/><rect x="-26" y="8" width="52" height="7" rx="3.5"/>
      </g>
      <g transform="rotate(45) translate(0 -150)">
        <rect x="-26" y="-14" width="22" height="7" rx="3.5"/><rect x="4" y="-14" width="22" height="7" rx="3.5"/>
        <rect x="-26" y="-3" width="52" height="7" rx="3.5"/><rect x="-26" y="8" width="52" height="7" rx="3.5"/>
      </g>
      <g transform="rotate(90) translate(0 -150)">
        <rect x="-26" y="-14" width="52" height="7" rx="3.5"/>
        <rect x="-26" y="-3" width="22" height="7" rx="3.5"/><rect x="4" y="-3" width="22" height="7" rx="3.5"/>
        <rect x="-26" y="8" width="52" height="7" rx="3.5"/>
      </g>
      <g transform="rotate(135) translate(0 -150)">
        <rect x="-26" y="-14" width="22" height="7" rx="3.5"/><rect x="4" y="-14" width="22" height="7" rx="3.5"/>
        <rect x="-26" y="-3" width="22" height="7" rx="3.5"/><rect x="4" y="-3" width="22" height="7" rx="3.5"/>
        <rect x="-26" y="8" width="52" height="7" rx="3.5"/>
      </g>
      <g transform="rotate(180) translate(0 -150)">
        <rect x="-26" y="-14" width="22" height="7" rx="3.5"/><rect x="4" y="-14" width="22" height="7" rx="3.5"/>
        <rect x="-26" y="-3" width="22" height="7" rx="3.5"/><rect x="4" y="-3" width="22" height="7" rx="3.5"/>
        <rect x="-26" y="8" width="22" height="7" rx="3.5"/><rect x="4" y="8" width="22" height="7" rx="3.5"/>
      </g>
      <g transform="rotate(225) translate(0 -150)">
        <rect x="-26" y="-14" width="52" height="7" rx="3.5"/>
        <rect x="-26" y="-3" width="22" height="7" rx="3.5"/><rect x="4" y="-3" width="22" height="7" rx="3.5"/>
        <rect x="-26" y="8" width="22" height="7" rx="3.5"/><rect x="4" y="8" width="22" height="7" rx="3.5"/>
      </g>
      <g transform="rotate(270) translate(0 -150)">
        <rect x="-26" y="-14" width="22" height="7" rx="3.5"/><rect x="4" y="-14" width="22" height="7" rx="3.5"/>
        <rect x="-26" y="-3" width="52" height="7" rx="3.5"/>
        <rect x="-26" y="8" width="22" height="7" rx="3.5"/><rect x="4" y="8" width="22" height="7" rx="3.5"/>
      </g>
      <g transform="rotate(315) translate(0 -150)">
        <rect x="-26" y="-14" width="52" height="7" rx="3.5"/><rect x="-26" y="-3" width="52" height="7" rx="3.5"/>
        <rect x="-26" y="8" width="22" height="7" rx="3.5"/><rect x="4" y="8" width="22" height="7" rx="3.5"/>
      </g>
    </g>
    <!-- Hexagram 24, 复 (Return), at the centre -->
    <g fill="url(#gold)" opacity=".92" transform="translate(-45 -52)">
      <rect x="0" y="0" width="38" height="8" rx="4"/><rect x="52" y="0" width="38" height="8" rx="4"/>
      <rect x="0" y="20" width="38" height="8" rx="4"/><rect x="52" y="20" width="38" height="8" rx="4"/>
      <rect x="0" y="40" width="38" height="8" rx="4"/><rect x="52" y="40" width="38" height="8" rx="4"/>
      <rect x="0" y="60" width="38" height="8" rx="4"/><rect x="52" y="60" width="38" height="8" rx="4"/>
      <rect x="0" y="80" width="38" height="8" rx="4"/><rect x="52" y="80" width="38" height="8" rx="4"/>
      <rect x="0" y="100" width="90" height="8" rx="4"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(600 246)">
    <text x="0" y="0" font-family="Cinzel, Georgia, 'Times New Roman', serif" font-size="104" letter-spacing="2" fill="url(#gold)">LazyOracle</text>
    <text x="4" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#e8e6f2" opacity=".86">Tarot · BaZi · I Ching · Astrology · Feng Shui · Palmistry · Face</text>
    <text x="4" y="132" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#9aa0c4">Computed on your device. Read in your own words.</text>
    <rect x="4" y="166" width="150" height="4" rx="2" fill="url(#gold)" opacity=".8"/>
  </g>
</svg>
